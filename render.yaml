services:
  - type: web
    name: raoah-alkhamsa-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Raoah Alkhamsa
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: raoah-alkhamsa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: raoah-alkhamsa-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: raoah-alkhamsa-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: raoah-alkhamsa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: raoah-alkhamsa-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: raoah-alkhamsa-db
    plan: free