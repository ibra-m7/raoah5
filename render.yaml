# Render Blueprint — attach a persistent disk so uploaded product images survive redeploys.
# Dashboard: Settings → Disks → Add Disk → mount path:
#   /var/www/html/storage/app/public
services:
  - type: web
    name: raoah5
    runtime: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: product-uploads
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1
